<title>Field Guide Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centered column. Home = topic picker, quiz = one question per screen, results = score + misses.
   Feedback is styled like compiler output: "Build succeeded" vs "error CS0000: wrong answer". */
:root {
  --bg: #f0f1f7;
  --surface: #ffffff;
  --ink: #161827;
  --muted: #5b6079;
  --line: #d9dcea;
  --accent: #5a3fd0;
  --accent-ink: #ffffff;
  --accent-soft: #e9e5fb;
  --ok: #167a3b;
  --ok-bg: #e1f4e8;
  --bad: #bf2f2d;
  --bad-bg: #fae6e5;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1120; --surface: #171a2e; --ink: #eceefb; --muted: #98a0be; --line: #2a2f4c;
    --accent: #a190ff; --accent-ink: #130f2b; --accent-soft: #272248;
    --ok: #55c982; --ok-bg: #11301f; --bad: #ff7370; --bad-bg: #3b1819;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1120; --surface: #171a2e; --ink: #eceefb; --muted: #98a0be; --line: #2a2f4c;
  --accent: #a190ff; --accent-ink: #130f2b; --accent-soft: #272248;
  --ok: #55c982; --ok-bg: #11301f; --bad: #ff7370; --bad-bg: #3b1819;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
code, .mono { font-family: var(--font-mono); }
code { font-size: .88em; background: var(--accent-soft); color: var(--ink); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere; }
pre { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; background: var(--accent-soft); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 10px 0 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand b { font-family: var(--font-mono); font-size: 13px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.brand b i { font-style: normal; color: var(--accent); }
.link { background: none; border: 0; padding: 6px 2px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }

.hero h1 { font-size: clamp(34px, 8vw, 54px); font-weight: 800; letter-spacing: -.02em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); max-width: 52ch; margin: 12px 0 0; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 16px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.panel h2 { font-size: 20px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.small { font-size: 13px; color: var(--muted); }

.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 14px; }
.topic { position: relative; }
.topic input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.topic span { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 14.5px; font-weight: 500; }
.topic small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.topic input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.topic input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.seg button { min-height: 40px; min-width: 56px; padding: 6px 14px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; font-weight: 500; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.btn { min-height: 48px; padding: 10px 22px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.alt { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* quiz */
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.tag { font-family: var(--font-mono); font-size: 12px; background: var(--accent-soft); color: var(--ink); padding: 3px 9px; border-radius: 99px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.qtext { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 4.6vw, 25px); line-height: 1.25; margin: 0; text-wrap: pretty; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
.opt { width: 100%; text-align: left; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px 14px; min-height: 52px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.letter { font-family: var(--font-mono); font-weight: 600; font-size: 13px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.otext { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.badge { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .letter { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.right .badge { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.wrong .badge { color: var(--bad); }
.opt.other { opacity: .78; }
.opt.other .badge { color: var(--muted); }

.verdict { margin-top: 18px; border-radius: 12px; padding: 14px 16px; border: 1.5px solid; }
.verdict.ok { border-color: var(--ok); background: var(--ok-bg); }
.verdict.bad { border-color: var(--bad); background: var(--bad-bg); }
.vline { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.verdict.ok .vline { color: var(--ok); }
.verdict.bad .vline { color: var(--bad); }
.verdict p { margin: 6px 0 0; }
.next { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.hint { font-size: 13px; color: var(--muted); }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); }

/* results */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 16vw, 92px); line-height: 1; letter-spacing: -.03em; }
.score .of { font-family: var(--font-mono); color: var(--muted); font-size: 15px; }
.tb { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 6px 14px; margin-top: 14px; align-items: center; }
.tb .name { font-size: 14.5px; font-weight: 500; overflow-wrap: anywhere; }
.tb .val { font-family: var(--font-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.tb .bar { grid-column: 1 / -1; height: 8px; margin-bottom: 8px; }
.tb .bar > i { background: var(--ok); }
.tb .bar.low > i { background: var(--bad); }
.miss { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
.miss:first-of-type { border-top: 0; padding-top: 0; margin-top: 12px; }
.miss h3 { font-size: 17px; font-weight: 600; line-height: 1.3; margin: 6px 0 10px; overflow-wrap: anywhere; }
.line { display: grid; grid-template-columns: 86px 1fr; gap: 10px; font-size: 14.5px; margin-top: 6px; }
.line b { font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding-top: 2px; }
.line.r b { color: var(--ok); }
.line.w b { color: var(--bad); }
.line span { min-width: 0; overflow-wrap: anywhere; }
.why { margin: 8px 0 0; font-size: 14.5px; color: var(--muted); }
@media (max-width: 440px) { .line { grid-template-columns: 1fr; gap: 0; } .qcard { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<script>
const DATA = {".NET Basics":[["Which component turns IL into machine code while your app runs?","The JIT compiler inside the CLR","Roslyn","NuGet","MSBuild","Roslyn compiles C# to IL at build time. The JIT, part of the CLR, converts IL to native code the first time a method is called."],["What does the Roslyn compiler produce from your C# source?","IL (Intermediate Language) stored in a .dll or .exe","Native machine code for your CPU","A NuGet package","A Docker image","Roslyn outputs IL. Native code is generated later by the JIT."],["Which statement correctly separates the language from the runtime?","C# is the language, the CLR is the runtime that executes IL","The CLR is the language, C# is the runtime","C# and the CLR are the same thing","The BCL is the runtime, the CLR is the library","C# is what you write. The CLR loads IL, JIT-compiles it, runs the GC and enforces type safety."],["What does BCL stand for?","Base Class Library","Binary Compiled Library","Basic Code Loader","Build Configuration Layer","The BCL ships with .NET and provides List<T>, Task, HttpClient, File, DateTime and more."],["What is NuGet?","The package manager for .NET libraries","The .NET garbage collector","A C# compiler","A web server","NuGet downloads the packages listed in your .csproj files."],["Which file lists a project's package and project references?","The .csproj file","The .sln file","appsettings.json","launchSettings.json","Each project's .csproj holds PackageReference and ProjectReference items, plus settings like TargetFramework."],["What is a .sln file for?","It groups one or more projects into a solution","It stores compiled IL","It configures the CLR garbage collector","It lists NuGet vulnerabilities","A solution is a container for projects. Each project builds one assembly."],["What is the default accessibility of a top-level class with no modifier?","internal","public","private","protected","Top-level types default to internal, visible only inside the same assembly."],["What is the default accessibility of a class member with no modifier?","private","internal","public","protected","Members default to private, the most restrictive option that makes sense."],["Who can see an `internal` member?","Code in the same assembly (project)","Everyone, including other assemblies","Only the same class","Only derived classes","internal limits visibility to the same assembly."],["What does `private protected` allow?","Access from derived classes in the same assembly only","Access from any derived class anywhere","Access from the whole assembly","Access only from the same class","private protected is the intersection: same assembly AND subclass. protected internal is the union."],["What does a self-contained deployment include?","The .NET runtime bundled with your app","Only your DLLs, requiring a preinstalled runtime","Only the source code","A compiled native OS kernel","Self-contained output is larger but runs without a runtime installed."],["What does a framework-dependent deployment require on the target machine?","The matching .NET runtime installed","Visual Studio","The .NET SDK and Roslyn","Docker Desktop","Framework-dependent output is small because it relies on a preinstalled runtime."],["Which command applies EF Core migrations to the database?","dotnet ef database update","dotnet ef migrations add","dotnet publish","dotnet restore","migrations add creates the migration. database update applies it."],["Which .NET releases are LTS (Long Term Support)?","Even-numbered ones such as 8 and 10","Odd-numbered ones such as 9 and 11","Every release","Only preview releases","Even-numbered releases get three years of support. Odd ones are STS with a shorter window."],["Why can one compiled DLL run on Windows, Linux and macOS?","IL is portable and the JIT emits CPU-specific code at runtime","Roslyn compiles separate DLLs per OS automatically","The DLL contains native code for every CPU","Docker translates the DLL","Portable IL plus a per-platform runtime is why Windows-built apps run in Linux containers."],["Which project setting turns on nullable reference type warnings?","<Nullable>enable<\/Nullable>","<NullSafe>true<\/NullSafe>","<Strict>on<\/Strict>","<ImplicitUsings>enable<\/ImplicitUsings>","With Nullable enabled, string means non-null and string? means maybe null."],["What does `<ImplicitUsings>enable<\/ImplicitUsings>` do?","Automatically imports common namespaces like System and System.Linq","Removes all using statements at runtime","Enables nullable warnings","Makes all classes public","It generates global usings so you do not repeat common imports in every file."],["What does `dotnet watch` do?","Runs the app and reloads it when files change","Monitors memory leaks","Watches NuGet for updates","Starts a debugger on a remote machine","dotnet watch gives you fast feedback with hot reload during development."],["In a Clean Architecture style solution, which way do dependencies point?","Inward, toward the Domain","Outward, toward Infrastructure","In both directions equally","Toward the API project","Domain depends on nothing. Application depends on Domain. Infrastructure and API depend on Application."],["Which line is a file-scoped namespace?","namespace MyApp.Domain.Orders;","namespace MyApp.Domain.Orders { }","using namespace MyApp;","package MyApp.Domain;","The semicolon form applies to the whole file and saves an indentation level."],["What is `dotnet user-secrets` meant for?","Keeping development secrets out of source control","Encrypting production databases","Signing NuGet packages","Managing Azure Key Vault in production","It stores secrets outside the repo for local development only. Use a vault in production."],["Which Docker base image is normally used for the final runtime stage of an ASP.NET Core app?","mcr.microsoft.com/dotnet/aspnet","mcr.microsoft.com/dotnet/sdk","ubuntu:latest only","node:alpine","The aspnet image is small and has no SDK. The sdk image is used only in the build stage."],["Which build configuration should you benchmark and deploy?","Release","Debug","Either, they are identical","Preview","Release builds are optimized. Debug keeps extra information for the debugger."],["What is a 'top-level statements' program?","A Program.cs without an explicit Main method or Program class","A program that only runs at the root OS level","A program with no namespaces","A program with only static classes","The compiler generates the entry point for you, which is what current templates use."]],"C# Fundamentals":[["Which type should you use for currency?","decimal","double","float","long","decimal stores exact base-10 digits. double cannot represent 0.1 exactly."],["What does `0.1 + 0.2 == 0.3` evaluate to for doubles?","false","true","It throws an exception","It does not compile","Binary floating point cannot represent 0.1 and 0.2 exactly, so the sum is slightly off 0.3."],["Which is a value type?","struct","class","string","List<int>","structs, enums and primitives are value types. classes, strings and collections are reference types."],["After `int a = 5; int b = a; b = 10;` what is `a`?","5","10","0","It is undefined","Value types are copied on assignment, so a and b are independent."],["After `var l2 = l1; l2.Add(3);` where l1 is a List<int>, what happens to l1?","It also contains 3","It is unchanged","A compile error occurs","A copy-on-write exception is thrown","List<T> is a reference type. Both variables point at the same object."],["What is boxing?","Wrapping a value type in an object on the heap","Putting a class inside a struct","Converting a string to an int","Locking an object for threads","Boxing allocates. It is a hidden cost, especially in loops. Generics avoid it."],["Which statement about strings is true?","They are immutable reference types","They are mutable value types","They are mutable reference types","They are immutable value types","Every modification creates a new string. == compares contents."],["What should you use for many string appends in a loop?","StringBuilder","The + operator","string.Concat in a loop","A char array without conversion","StringBuilder avoids allocating a new string on every append."],["Which comparison is best for identifiers and file extensions?","StringComparison.OrdinalIgnoreCase","Culture-sensitive comparison","ToLower() then ==","CompareTo with no options","Ordinal comparisons are fast and not affected by the user's culture."],["What is the purpose of an `out` parameter?","To return an extra value, the callee must assign it","To pass a variable that must already be initialized","To make a parameter optional","To pass a variable number of arguments","int.TryParse(s, out int n) is the classic example."],["What does `params` allow?","A variable number of arguments","Pass by reference","Optional parameters","Named arguments only","params int[] nums lets callers write Sum(1, 2, 3, 4)."],["How does `int.TryParse` differ from `int.Parse` for bad input?","TryParse returns false, Parse throws","TryParse throws, Parse returns false","Both return 0","Both return null","Use TryParse for user input so bad data is not an exception."],["Which collection gives O(1) average lookup by key?","Dictionary<TKey, TValue>","List<T>","Queue<T>","LinkedList<T>","A Dictionary hashes the key to find its bucket."],["When is HashSet<T> the right choice?","When you need uniqueness or fast membership checks","When you need index access","When you need items in insertion order","When you need FIFO behavior","HashSet gives O(1) average Contains and ignores duplicates."],["Which collection is first-in, first-out?","Queue<T>","Stack<T>","SortedSet<T>","HashSet<T>","Queue uses Enqueue and Dequeue."],["Which collection is last-in, first-out?","Stack<T>","Queue<T>","Dictionary<K,V>","List<T>","Stack uses Push and Pop."],["Which parameter type is the most flexible for a method that only loops over items?","IEnumerable<T>","List<T>","T[]","Dictionary<int,T>","Accept the most general type you need. IEnumerable<T> accepts lists, arrays, sets and LINQ queries."],["With nullable reference types on, what does `string?` mean?","The value may be null and the compiler tracks it","The value is always null","The string is optional at runtime and cannot be null","The string is a value type","It is a compile-time annotation with warnings. It is not enforced at runtime."],["What does `x ??= 5` do?","Assigns 5 only if x is null","Always assigns 5","Throws if x is null","Compares x to 5","??= is the null-coalescing assignment operator."],["What does `a?.Length` return when `a` is null?","null","0","An exception is thrown","An empty string","?. short-circuits and yields null. Combine with ?? to supply a default."],["What does the null-forgiving operator `!` do?","Suppresses the nullable warning with no runtime check","Throws if the value is null","Converts null to default","Makes the value non-nullable at runtime","x! only tells the compiler to trust you. A null will still crash later."],["How do you combine values of a [Flags] enum?","With bitwise OR (|)","With the + operator on names","With &&","With string.Join","Permissions.Read | Permissions.Write, then HasFlag to test."],["What does `==` compare for two different string objects with equal text?","Their contents, so it returns true","Their references, so it returns false","Their hash codes only","Nothing, it does not compile","string overloads == to compare contents."],["What does `==` do by default on two instances of a plain class?","Compares references","Compares all properties","Compares hash codes only","Compares their types","Records generate value equality. Plain classes use reference equality unless overridden."],["What is the difference between `const` and `readonly`?","const is a compile-time literal, readonly is assigned at runtime in a constructor or initializer","const can change at runtime, readonly cannot","They are identical","readonly only works on strings","const values are baked into callers at compile time."],["What is the time complexity of `List<T>.Contains`?","O(n)","O(1)","O(log n)","O(n log n)","It scans the list. Use a HashSet when you check membership repeatedly."],["What does `var` do?","Lets the compiler infer the static type","Makes the variable dynamically typed","Makes the variable nullable","Creates a global variable","var is still strongly typed. It only saves you from writing the type."]],"OOP":[["What does encapsulation mean?","Hiding internal state and exposing safe operations","Creating subclasses","Writing the same method for many types","Converting objects to JSON","Keep rules next to the data they protect, so state cannot be set to nonsense."],["What does `{ get; init; }` allow?","Setting the property only during construction or object initialization","Setting it any time","Reading it only inside the class","Setting it only from a derived class","init makes the property effectively immutable after creation."],["What does the `required` modifier on a property do?","Forces the caller to set it when creating the object","Makes it read-only forever","Makes it nullable","Makes it static","required (C# 11) produces a compile error if the initializer omits it."],["Which keyword forces subclasses to supply an implementation?","abstract","virtual","sealed","static","An abstract member has no body. A virtual member has a default that may be overridden."],["What does `virtual` mean on a method?","A subclass may override it","A subclass must override it","It cannot be called","It runs only at compile time","Combine virtual with override to get runtime polymorphism."],["What happens when a derived class uses `new` on a base member name?","It hides the base member instead of overriding it","It overrides the member with dynamic dispatch","It creates a new object","It is a syntax error","Hiding breaks polymorphism and is almost always a bug."],["What does `sealed` do to a class?","Prevents other classes from inheriting from it","Makes it immutable","Makes all members static","Hides it from other assemblies","Seal classes you did not design for inheritance."],["Which statement about interfaces is true?","A class can implement many interfaces","A class can inherit from many classes","Interfaces can hold instance fields","Interfaces have constructors","Interfaces define contracts and allow multiple implementation. A class has one base class."],["When is an abstract class better than an interface?","When closely related types share code and state","When you need many unrelated implementations","When you want to support multiple inheritance","When you want to avoid inheritance","Abstract classes can have fields, constructors and shared behavior."],["What is 'composition over inheritance'?","Build behavior by combining small objects rather than deep hierarchies","Always use abstract classes","Never use interfaces","Use inheritance for everything","Has-a relationships are easier to change than is-a trees."],["How does assignment differ between a struct and a class?","Struct copies data, class copies the reference","Struct copies the reference, class copies data","Both copy data","Both copy references","That is the core value-type versus reference-type difference."],["Which type is a good fit for a struct?","A small immutable value like a point or money amount","A large mutable entity","A class hierarchy root","An object with many collections","Small, immutable and short-lived values suit structs."],["What does a `record` give you for free?","Value-based equality, ToString and `with` copying","Automatic database mapping","Thread safety","Garbage-collection exemption","Records are ideal for DTOs, messages and value objects."],["What does `var older = person with { Age = 31 };` do?","Creates a copy with Age changed and leaves the original untouched","Mutates person.Age in place","Throws because records are readonly","Creates a reference to the same object","with is non-destructive copying for records."],["Given `record Perso hile","Closing database connections","Limiting CPU use","Encrypting traffic","It makes the system fail fast instead of piling on."],["What is the best practice for retries?","Exponential backoff with jitter for transient failures","Retry immediately forever","Never retry","Retry on every error including validation","Jitter avoids thundering herds."],["What is a Saga?","A sequence of local transactions with compensating actions","A single distributed transaction","A caching layer","A deployment strategy","If charging fails, release the stock reservation."],["Which are the two saga styles?","Choreography and orchestration","Push and pull","Eager and lazy","Strong and weak","Choreography reacts to events. Orchestration uses a coordinator."],["What does the Specification pattern package?","A reusable, combinable query criterion","A test specification","A deployment spec","A UI spec","OverdueOrders.Criteria returns an Expression<Func<Order,bool>>."]],"Testing":[["Which test level is fastest and most numerous in the test pyramid?","Unit tests","End-to-end tests","Manual tests","Load tests","Many fast isolated tests at the base, few slow UI tests at the top."],["What does AAA stand for in testing?","Arrange, Act, Assert","Analyze, Apply, Approve","Add, Alter, Archive","Authenticate, Authorize, Audit","Set up, do one thing, verify."],["Which xUnit attribute runs one test with several data sets?","[Theory] with [InlineData]","[Fact]","[Setup]","[TestCase]","[Fact] is a single test. [Theory] is parameterized."],["How does xUnit create test class instances?","A new instance per test","One instance for all tests","One instance per assembly","A static instance","Use the constructor for setup and IDisposable for teardown."],["What is a stub?","A test double that returns canned answers","A real implementation","A verifier of calls","A load tester","A mock verifies interactions. A stub just supplies data."],["What is a fake?","A lightweight working implementation, like an in-memory const ALL = [];
Object.entries(DATA).forEach(([topic, qs]) => qs.forEach((q, i) => {
  ALL.push({ id: topic + '|' + i, topic, q: q[0], a: q[1], w: q.slice(2, 5), e: q[5] });
}));
const TOPICS = Object.keys(DATA);
const LENGTHS = [10, 25, 50, 100, 0];
const LS = 'fieldguide-quiz-v1';

/* ---------- storage (best effort) ---------- */
function load() {
  try { const v = JSON.parse(localStorage.getItem(LS) || '{}'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem(LS, JSON.stringify({ topics: [...prefs.topics], len: prefs.len, missed: [...prefs.missed] })); } catch (e) {}
}
const stored = load();
const prefs = {
  topics: new Set(Array.isArray(stored.topics) ? stored.topics.filter(t => TOPICS.includes(t)) : TOPICS),
  len: LENGTHS.includes(stored.len) ? stored.len : 25,
  missed: new Set(Array.isArray(stored.missed) ? stored.missed.filter(id => ALL.some(q => q.id === id)) : [])
};
if (prefs.topics.size === 0) TOPICS.forEach(t => prefs.topics.add(t));

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const LETTERS = 'ABCD';
let S = null; // current session

/* ---------- home ---------- */
function home() {
  S = null;
  const pool = ALL.filter(q => prefs.topics.has(q.topic));
  const n = prefs.len === 0 ? pool.length : Math.min(prefs.len, pool.length);
  app.innerHTML = `
    <div class="brand"><b>FIELD GUIDE <i>/</i> QUIZ</b></div>
    <section class="hero">
      <h1>Test what the <em>guide</em> taught you.</h1>
      <p>Multiple choice questions on C#, .NET, design patterns, system design, security, DevOps, React and algorithms. After each answer you see the right option, the wrong ones, and why.</p>
      <div class="stats"><span><b>${ALL.length}</b> questions</span><span><b>${TOPICS.length}</b> topics</span><span><b>${prefs.missed.size}</b> saved misses</span></div>
    </section>
    <section class="panel">
      <div class="row"><h2>Topics</h2>
        <span><button class="link" id="all">Select all</button> &nbsp; <button class="link" id="none">Clear</button></span></div>
      <div class="topics">${TOPICS.map((t, i) => `
        <label class="topic"><input type="checkbox" id="t${i}" data-t="${esc(t)}" ${prefs.topics.has(t) ? 'checked' : ''}>
        <span>${esc(t)}<small>${DATA[t].length}</small></span></label>`).join('')}</div>
    </section>
    <section class="panel">
      <h2>Length</h2>
      <div class="seg" id="seg">${LENGTHS.map(l => `<button type="button" data-l="${l}" aria-pressed="${prefs.len === l}">${l === 0 ? 'All' : l}</button>`).join('')}</div>
      <div class="row" style="margin-top:18px">
        <span class="small" id="avail">${pool.length} questions in your selection. This round: ${n}.</span>
        <div class="actions">
          <button class="btn alt" id="misses" ${prefs.missed.size ? '' : 'disabled'}>Drill my misses (${prefs.missed.size})</button>
          <button class="btn" id="start" ${pool.length ? '' : 'disabled'}>Start quiz</button>
        </div>
      </div>
    </section>`;
  app.querySelectorAll('.topic input').forEach(el => el.addEventListener('change', () => {
    el.checked ? prefs.topics.add(el.dataset.t) : prefs.topics.delete(el.dataset.t);
    save(); home(); const again = document.getElementById(el.id); if (again) again.focus();
  }));
  document.getElementById('all').onclick = () => { TOPICS.forEach(t => prefs.topics.add(t)); save(); home(); };
  document.getElementById('none').onclick = () => { prefs.topics.clear(); save(); home(); };
  app.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
    prefs.len = +b.dataset.l; save(); home(); document.querySelector('#seg [aria-pressed="true"]').focus();
  });
  document.getElementById('start').onclick = () => begin(shuffle(pool).slice(0, n));
  document.getElementById('misses').onclick = () => begin(shuffle(ALL.filter(q => prefs.missed.has(q.id))));
}

/* ---------- quiz ---------- */
function begin(list) {
  S = { list, i: 0, score: 0, results: [], answered: false };
  show();
}
function show() {
  const q = S.list[S.i];
  q.opts = q.opts || shuffle([{ t: q.a, ok: true }, ...q.w.map(t => ({ t, ok: false }))]);
  const pct = (S.i / S.list.length) * 100;
  app.innerHTML = `
    <div class="brand"><b>FIELD GUIDE <i>/</i> QUIZ</b><button class="link" id="quit">End quiz</button></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.list.length}" aria-valuenow="${S.i}"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>Question <b>${S.i + 1}</b> of <b>${S.list.length}</b></span><span class="tag">${esc(q.topic)}</span><span>Score <b>${S.score}</b></span></div>
    <section class="qcard">
      <p class="qtext" id="qt">${fmt(q.q)}</p>
      <ul class="opts" role="group" aria-labelledby="qt">${q.opts.map((o, i) => `
        <li><button class="opt" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span class="otext">${fmt(o.t)}</span></button></li>`).join('')}</ul>
      <div id="fb" aria-live="polite"></div>
    </section>
    <div class="hint">Press <kbd>1</kbd>-<kbd>4</kbd> or <kbd>A</kbd>-<kbd>D</kbd> to answer.</div>`;
  S.answered = false;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  document.getElementById('quit').onclick = () => S.results.length ? finish() : home();
}
function answer(idx) {
  if (S.answered) return;
  S.answered = true;
  const q = S.list[S.i];
  const picked = q.opts[idx];
  const ok = picked.ok;
  if (ok) { S.score++; prefs.missed.delete(q.id); } else prefs.missed.add(q.id);
  save();
  S.results.push({ q, ok, picked: picked.t });
  app.querySelectorAll('.opt').forEach((b, i) => {
    const o = q.opts[i];
    b.disabled = true;
    const badge = document.createElement('span');
    badge.className = 'badge';
    if (o.ok) { b.classList.add('right'); badge.textContent = i === idx ? 'CORRECT · your answer' : 'CORRECT ANSWER'; }
    else if (i === idx) { b.classList.add('wrong'); badge.textContent = 'WRONG · your answer'; }
    else { b.classList.add('other'); badge.textContent = 'WRONG'; }
    b.querySelector('.otext').appendChild(badge);
  });
  const last = S.i === S.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${ok ? 'ok' : 'bad'}">
      <div class="vline">${ok ? 'Build succeeded. 0 errors.' : 'error CS0029: wrong answer, see the green option.'}</div>
      <p>${fmt(q.e)}</p>
    </div>
    <div class="next"><span class="hint">Press <kbd>Enter</kbd> to continue.</span>
    <button class="btn" id="nx">${last ? 'See results' : 'Next question'}</button></div>`;
  document.getElementById('nx').onclick = next;
}
function next() {
  if (!S.answered) return;
  S.i++;
  S.i >= S.list.length ? finish() : show();
  window.scrollTo(0, 0);
}

/* ---------- results ---------- */
function finish() {
  const total = S.results.length;
  const pct = total ? Math.round((S.score / total) * 100) : 0;
  const misses = S.results.filter(r => !r.ok);
  const by = {};
  S.results.forEach(r => { const t = by[r.q.topic] = by[r.q.topic] || { n: 0, ok: 0 }; t.n++; if (r.ok) t.ok++; });
  const rows = Object.entries(by).sort((a, b) => (a[1].ok / a[1].n) - (b[1].ok / b[1].n));
  const msg = pct >= 90 ? 'Interview ready on this material.' : pct >= 70 ? 'Solid. Review the misses below.' : pct >= 50 ? 'Getting there. Drill your misses.' : 'Keep going. Reread those chapters, then retry.';
  const sess = S;
  app.innerHTML = `
    <div class="brand"><b>FIELD GUIDE <i>/</i> QUIZ</b></div>
    <section class="panel">
      <div class="score"><span class="big">${pct}%</span><span class="of">${S.score} of ${total} correct</span></div>
      <p style="margin:10px 0 0">${msg}</p>
      <div class="actions" style="margin-top:16px">
        <button class="btn" id="retry" ${misses.length ? '' : 'disabled'}>Retry ${misses.length} missed</button>
        <button class="btn alt" id="again">New quiz</button>
      </div>
    </section>
    <section class="panel"><h2>By topic</h2>
      <div class="tb">${rows.map(([t, v]) => { const p = Math.round(v.ok / v.n * 100); return `
        <span class="name">${esc(t)}</span><span class="val">${v.ok}/${v.n}</span>
        <div class="bar ${p < 60 ? 'low' : ''}"><i style="width:${p}%"></i></div>`; }).join('')}</div>
    </section>
    ${misses.length ? `<section class="panel"><h2>What you missed</h2>${misses.map(r => `
      <div class="miss"><span class="tag">${esc(r.q.topic)}</span>
        <h3>${fmt(r.q.q)}</h3>
        <div class="line r"><b>CORRECT</b><span>${fmt(r.q.a)}</span></div>
        <div class="line w"><b>YOU CHOSE</b><span>${fmt(r.picked)}</span></div>
        <p class="why">${fmt(r.q.e)}</p></div>`).join('')}</section>` : ''}`;
  document.getElementById('again').onclick = home;
  document.getElementById('retry').onclick = () => {
    const list = sess.results.filter(r => !r.ok).map(r => { const q = r.q; q.opts = null; return q; });
    begin(shuffle(list));
  };
  window.scrollTo(0, 0);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!S || S.i >= S.list.length || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (!S.answered) {
    let i = '1234'.indexOf(k);
    if (i < 0) i = 'abcd'.indexOf(k);
    if (i >= 0 && i < S.list[S.i].opts.length) { e.preventDefault(); answer(i); }
  } else if (k === 'enter' || k === ' ' || k === 'arrowright') {
    e.preventDefault(); next();
  }
});

home();
</script>
